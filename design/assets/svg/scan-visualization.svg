<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-labelledby="title desc">
  <title id="title">Scan phase visualisation</title>
  <desc id="desc">Four bounded scan phases move from local inventory to trusted source comparison.</desc>
  <rect width="420" height="180" rx="20" fill="#F7F9FC"/>
  <path d="M60 88h300" stroke="#D7DEE8" stroke-width="6" stroke-linecap="round"/>
  <path d="M60 88h200" stroke="#1F62D1" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">
    <circle cx="60" cy="88" r="17" fill="#1F62D1"/><path d="m52 88 6 6 10-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="126" fill="#172033">Inventory</text>
    <circle cx="160" cy="88" r="17" fill="#1F62D1"/><path d="m152 88 6 6 10-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="126" fill="#172033">Normalise</text>
    <circle cx="260" cy="88" r="20" fill="#fff" stroke="#1F62D1" stroke-width="5"/><circle cx="260" cy="88" r="6" fill="#1F62D1"/><text x="260" y="126" fill="#172033">Compare</text>
    <circle cx="360" cy="88" r="17" fill="#fff" stroke="#AEB8C8" stroke-width="3"/><text x="360" y="126" fill="#526077">Summarise</text>
  </g>
</svg>

