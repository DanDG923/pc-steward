<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-labelledby="title desc">
  <title id="title">PC Steward storage visualisation</title>
  <desc id="desc">A segmented ring separates scan data, downloaded files, source metadata, and history.</desc>
  <rect width="420" height="220" rx="20" fill="#F7F9FC"/>
  <g transform="translate(118 110) rotate(-90)">
    <circle r="68" fill="none" stroke="#EDF1F6" stroke-width="24"/>
    <circle r="68" fill="none" stroke="#1F62D1" stroke-width="24" stroke-dasharray="180 247" stroke-dashoffset="0"/>
    <circle r="68" fill="none" stroke="#16859A" stroke-width="24" stroke-dasharray="96 331" stroke-dashoffset="-184"/>
    <circle r="68" fill="none" stroke="#2A8B5C" stroke-width="24" stroke-dasharray="55 372" stroke-dashoffset="-284"/>
    <circle r="68" fill="none" stroke="#B87800" stroke-width="24" stroke-dasharray="48 379" stroke-dashoffset="-343"/>
  </g>
  <text x="118" y="105" text-anchor="middle" fill="#172033" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="22" font-weight="600">1.34 GB</text>
  <text x="118" y="127" text-anchor="middle" fill="#526077" font-family="Segoe UI, sans-serif" font-size="12">app-owned data</text>
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#172033">
    <circle cx="238" cy="67" r="6" fill="#1F62D1"/><text x="252" y="72">Downloaded files · 640 MB</text>
    <circle cx="238" cy="101" r="6" fill="#16859A"/><text x="252" y="106">Scan data · 342 MB</text>
    <circle cx="238" cy="135" r="6" fill="#2A8B5C"/><text x="252" y="140">Source metadata · 198 MB</text>
    <circle cx="238" cy="169" r="6" fill="#B87800"/><text x="252" y="174">Logs &amp; history · 160 MB</text>
  </g>
</svg>

