version: 2
updates:
  # Central package management: Dependabot updates Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    # Security updates only during 2.0: NuGet version changes go through
    # owner-approved servicing tasks (see docs/review/V2_DEPENDENCY_SERVICING_PROPOSAL.md).
    open-pull-requests-limit: 0
    groups:
      mstest:
        patterns: ['Microsoft.NET.Test.Sdk', 'MSTest.*']
      sqlite:
        # The e_sqlite3 pin must stay at or above what Microsoft.Data.Sqlite needs.
        patterns: ['Microsoft.Data.Sqlite*', 'SQLitePCLRaw.*']
      winget:
        patterns: ['Microsoft.WindowsPackageManager.*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  # design/prototype is an archived reference outside CI, so it only gets
  # security updates, not scheduled version updates.
