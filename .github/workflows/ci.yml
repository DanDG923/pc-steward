name: CI

on:
  pull_request:
  push:
    branches: [phase/0-foundation]

# Public repository: every job gets a read-only token unless it asks for more.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      # Restored test adapters must also be accessible to the standard test user.
      NUGET_PACKAGES: ${{ github.workspace }}\artifacts\nuget-packages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: pwsh -NoProfile -File ./scripts/Restore.ps1
      - run: pwsh -NoProfile -File ./scripts/Build.ps1
      # Security fixtures must compile/run without the hosted runner's admin token.
      - run: pwsh -NoProfile -File ./scripts/Test-CI.ps1

  package-licence-map:
    # Task 53A (NFR-MNT-01/05): publish the desktop payload and check that the licence/NOTICE map in
    # New-PrivateBetaPackage.ps1 reconciles exactly to the packages in its dependency manifest, using each restored package's
    # own nuspec, licence and NOTICE files. Uses the default NuGet cache, which the script reads. No signing or install.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File ./scripts/New-PrivateBetaPackage.ps1
      - run: pwsh -NoProfile -File ./scripts/Test-PrivateBetaPackageEvidence.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-licence-map
          path: artifacts/private-beta/reports/
          if-no-files-found: ignore
          retention-days: 14

  desktop-launch-smoke:
    # UI polish phase 5 pre-flight, informational only (never gates): build the desktop app, start it on the hosted runner,
    # open every page from the navigation pane through UI Automation and check that the process survives each one (a
    # missing XAML resource ends it). Logs each page's UI Automation tree and unnamed controls, and saves screenshots.
    # No owner-only script, certificate, install or elevation request.
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\artifacts\nuget-packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The owner's phase 5 redeploy paste must parse under Windows PowerShell 5.1 before it is handed over.
      - shell: powershell
        run: |
          $e = $null; $t = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'docs/review/UI_POLISH_PHASE5_REDEPLOY.ps1').Path, [ref]$t, [ref]$e)
          $e | ForEach-Object { 'PARSE-ERROR line ' + $_.Extent.StartLineNumber + ': ' + $_.Message }
          'PASTE-PARSE errors=' + @($e).Count
          exit @($e).Count
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/Test-DesktopLaunchSmokeCI.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-launch-smoke
          path: |
            artifacts/desktop-launch-smoke/*.png
            artifacts/desktop-launch-smoke/*.log
          if-no-files-found: ignore
          retention-days: 14

  task50-cleanup-paste:
    # Task 50 cleanup (docs/review/TASK_50_CLEANUP.md): before it is handed over, the owner's cleanup paste must parse under
    # Windows PowerShell 5.1 and do exactly what it says against this disposable runner's profile, clone location,
    # CurrentUser certificate stores, Program Files and ProgramData: remove the planned leftovers, keep look-alikes, skip
    # folders holding links, save the stash before dropping it, and change nothing unless the owner types YES. Gates.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/Test-Task50CleanupPasteCI.ps1

  helper-native-aot-feasibility:
    # Security review H1 follow-up (owner decision: Native AOT helper before G9-T1). Informational until the ADR is
    # accepted: compile the elevated helper with Native AOT into a scratch folder, list trim/AOT warnings, and start the
    # native image (never connected, no desktop beside it) with .NET runtime settings that today's framework-dependent
    # helper would act on. Uses no owner-only script, certificate, install or deployment.
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\artifacts\nuget-packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File ./scripts/Test-ElevatedHelperNativeAotCI.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: helper-native-aot-feasibility
          path: |
            artifacts/helper-native-aot/*.json
            artifacts/helper-native-aot/*.log
          if-no-files-found: ignore
          retention-days: 14

  owner-build-toolchain-check:
    # Task 50 CB3.7c (Codex security review of PR #32; owner decision 2026-11-10), informational only (never gates): pin the
    # official .NET SDK zip and the builder's restored NuGet packages for the owner's build commit, compare them with the pins
    # committed for the owner, then run the owner's read-only toolchain check under Windows PowerShell 5.1 on an untouched copy
    # (must pass) and after planting one change of each kind (must stop). No signing, certificate store, install or launch.
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the check runs on a worktree of the owner's build commit.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File ./scripts/Test-OwnerBuildToolchainCI.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owner-build-toolchain-pins
          path: ${{ runner.temp }}/toolchain-pins/*.json
          if-no-files-found: ignore
          retention-days: 14

  owner-only-candidate-builder:
    # Task 50 G3: build the unsigned v2 owner-only candidate end to end with the pinned SDK and validate its manifest
    # with the installer's own reader. No signing, certificate store, install or launch.
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\artifacts\nuget-packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the builder's probe-build mark (S7 obligation 1) checks the build commit's lineage.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The builder refuses an elevated token; the launcher runs it as a disposable standard user.
      - run: pwsh -NoProfile -File ./scripts/Test-OwnerOnlyCandidateBuilderCI.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owner-only-candidate-manifest
          path: artifacts/candidate-builder-evidence/*.json
          if-no-files-found: ignore
          retention-days: 14

  msi-install-test:
    # ADR-034 §5 (FR-UPD-04/15, TM-04/13): build this commit's payload as a disposable standard user, sign it and the MSI with
    # a throwaway self-signed key whose pin is written into this job's checkout only, then install to Program Files and check
    # the refusals, the protected DACL, the installed files against the release manifest, the pinned trust and capability
    # reader as a standard user, a major upgrade, a refused downgrade and uninstall. The key never enters a trust store and
    # is deleted at the end; the runner is disposable.
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\artifacts\nuget-packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the candidate builder's probe-build mark checks the build commit's lineage.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File ./scripts/Test-PCStewardMsiCI.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: msi-install-evidence
          path: |
            artifacts/msi-ci-evidence/*.json
            artifacts/msi-ci-evidence/logs/*.log
          if-no-files-found: ignore
          retention-days: 14

  native-helper-signing-diagnostic:
    # ADR-033 redeploy pre-flight, informational only (never gates): build this commit's candidate with the real builder
    # as a disposable standard user (native AOT helper), then run the owner-only signing diagnostic on COPIES of its two
    # executables, so the installer's Set-AuthenticodeSignature acceptance is seen on the native helper image before the
    # owner's redeploy. Same throwaway certificate, stores and clean-up as owner-only-signing-diagnostic below.
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\artifacts\nuget-packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the builder's probe-build mark checks the build commit's lineage.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File ./scripts/Test-OwnerOnlyCandidateBuilderCI.ps1
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/Test-OwnerOnlySigningDiagnosticCI.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-helper-signing-diagnostic
          path: artifacts/signing-diagnostic/*.json
          if-no-files-found: ignore
          retention-days: 14

  owner-only-signing-diagnostic:
    # Task 50 B-exec diagnosis, informational only (never gates): rebuild the owner's B1 candidate source (febf1ac) with the
    # G3 builder as a disposable standard user, then, elevated under Windows PowerShell 5.1, sign COPIES of both apphosts and
    # two controls with a throwaway self-signed code-signing certificate made like the installer's, and print the returned
    # Set-AuthenticodeSignature Status/StatusMessage/signer, Get-AuthenticodeSignature, signtool verify and PE facts. The
    # certificate is trusted in LocalMachine Root/TrustedPublisher and CurrentUser TrustedPublisher and removed at the end.
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    env:
      # Inside the pinned checkout, which the launcher makes writable for its disposable user.
      NUGET_PACKAGES: ${{ github.workspace }}\owner-candidate-source\artifacts\nuget-packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: febf1ac95c207aadf0f3efe742b854d81f903037
          path: owner-candidate-source
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: owner-candidate-source/global.json
      # The builder refuses an elevated token; the pinned checkout's own launcher runs it as a disposable standard user.
      - run: pwsh -NoProfile -File ./owner-candidate-source/scripts/Test-OwnerOnlyCandidateBuilderCI.ps1
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/Test-OwnerOnlySigningDiagnosticCI.ps1 -ExpectedSourceCommit febf1ac95c207aadf0f3efe742b854d81f903037
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owner-only-signing-diagnostic
          path: artifacts/signing-diagnostic/*.json
          if-no-files-found: ignore
          retention-days: 14
