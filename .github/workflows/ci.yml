name: CI

on:
  pull_request:
  push:
    branches: [phase/0-foundation]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: pwsh -NoProfile -File ./scripts/Restore.ps1
      - run: pwsh -NoProfile -File ./scripts/Build.ps1
      - run: pwsh -NoProfile -File ./scripts/Test.ps1
