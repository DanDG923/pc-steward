name: Spike - WinGet COM projection (Task 54A, temporary)

# Throwaway Task 54A evidence run. Removed again before the PR is merged; its results are copied into
# spikes/winget-com-projection/SPIKE_REPORT.md. Runs only on pushes to the spike branch. Uses no secret, certificate,
# release key or owner-only script, and edits only each runner's own disposable checkout.
on:
  push:
    branches: [claude/project-thread-0t86mm]
    paths:
      - 'spikes/winget-com-projection/**'
      - '.github/workflows/spike-winget-com-projection.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\artifacts\nuget-packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File ./spikes/winget-com-projection/Invoke-SpikeCI.ps1 -Stage probe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-probe
          path: artifacts/winget-com-spike/
          if-no-files-found: ignore
          retention-days: 30

  surface:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File ./spikes/winget-com-projection/Invoke-SpikeCI.ps1 -Stage surface
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-surface
          path: artifacts/winget-com-spike/
          if-no-files-found: ignore
          retention-days: 30

  solution:
    if: ${{ !contains(github.event.head_commit.message, '[probe-only]') }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, 1.11.560, 1.29.380]
    env:
      # Restored test adapters must also be accessible to the standard test user (as in ci.yml).
      NUGET_PACKAGES: ${{ github.workspace }}\artifacts\nuget-packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File ./spikes/winget-com-projection/Invoke-SpikeCI.ps1 -Stage solution -Variant ${{ matrix.variant }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-solution-${{ matrix.variant }}
          path: |
            artifacts/winget-com-spike/
            artifacts/desktop-launch-smoke/*.log
            artifacts/helper-native-aot/*.json
          if-no-files-found: ignore
          retention-days: 30
