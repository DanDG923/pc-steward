name: Release payload

# ADR-034 §5 (FR-UPD-15, TM-03/13): build the unsigned release payload (desktop and Native AOT helper) for the owner's
# signing script, on demand only. The candidate builder runs as a disposable standard user on a clean checkout of the
# chosen branch and refuses a commit without both compiled release pins. The artefact's SHA-256 digest, which GitHub
# publishes for the run, is what scripts/New-PCStewardRelease.ps1 checks the downloaded file against. No signing, key,
# certificate store or install happens here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-payload:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\artifacts\nuget-packages
    steps:
      # Actions pinned to full commits (tag at pinning time in the comment): a moved tag cannot change the payload.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the builder's probe-build mark checks the build commit's lineage.
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File ./scripts/Test-OwnerOnlyCandidateBuilderCI.ps1 -ReleasePayload
      # The unsigned MSI built from this payload, reduced to the digest of its tables (msi-reference.json): the signed MSI must
      # match it before the owner's PC installs it (security review H1).
      - run: pwsh -NoProfile -File ./scripts/New-PCStewardMsiReference.ps1 -ReleasePayloadRoot artifacts/release-payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-steward-release-payload
          path: artifacts/release-payload/
          if-no-files-found: error
          retention-days: 30
